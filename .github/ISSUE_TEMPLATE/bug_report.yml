name: Bug report
description: Report a reproducible ReliFinder problem without sharing sensitive database data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real credentials, configuration files, Oracle wallet files, schema names, reports, logs, sampled values, or screenshots containing private metadata.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using sanitized or synthetic names.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GUI, CLI, Both]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Oracle version, and driver mode. Sanitize host and service names.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials and database-identifying information from this report.
          required: true